# File → region rules (gitignore-style globs). Later rules win.
rules:
- match: /README.md
  region: project
- match: /pyproject.toml
  region: project
- match: docs/
  region: project
- match: .github/
  region: project
- match: src/code_atlas/
  region: map-builder
- match: src/code_atlas/cli.py
  region: command-line
- match: src/code_atlas/query.py
  region: command-line
- match: src/code_atlas/scan.py
  region: structure-scanner
- match: src/code_atlas/discover.py
  region: structure-scanner
- match: src/code_atlas/languages.py
  region: structure-scanner
- match: src/code_atlas/extract/
  region: extraction
- match: src/code_atlas/resolve.py
  region: resolution
- match: src/code_atlas/resolve_langs.py
  region: resolution
- match: src/code_atlas/scip.py
  region: resolution
- match: src/code_atlas/index.py
  region: structure-index
- match: src/code_atlas/graphdata.py
  region: structure-index
- match: src/code_atlas/semantic/
  region: semantic-store
- match: src/code_atlas/semantic/changeset.py
  region: changeset-rules
- match: src/code_atlas/semantic/tours.py
  region: changeset-rules
- match: src/code_atlas/semantic/regions.py
  region: changeset-rules
- match: src/code_atlas/semantic/agenda.py
  region: agent-views
- match: src/code_atlas/semantic/context.py
  region: agent-views
- match: src/code_atlas/skill/
  region: agent-skill
- match: frontend/
  region: viewer
- match: tests/
  region: verification
